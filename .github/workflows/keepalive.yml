# Pings the live site every 5 minutes so the free Render instance does not sleep.
name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AgentPurse
        run: curl -fsS -m 60 --retry 3 --retry-delay 10 https://agentpurse-k4bu.onrender.com/api/config > /dev/null
